<html>
<head>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: blue;
            /* Applying the animation */
            animation: changeColor 3s infinite;
        }

        /* Defining the animation steps */
        @keyframes changeColor {
            from {
                background-color: blue;
            }
            to {
                background-color: green;
            }
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>
</html>
